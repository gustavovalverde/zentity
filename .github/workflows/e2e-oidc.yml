name: E2E OIDC

# Nightly run of the OIDC-only Playwright tier (apps/web/e2e/oidc). It starts
# its own Next dev server against a fresh SQLite database and needs no FHE
# service, OCR service, Hardhat node, or confidential chain. The specs drive the
# protocol endpoints through Playwright's request fixture, so no browser is
# installed.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  oidc:
    name: OIDC Protocol Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm --filter @zentity/sdk build

      # Generates every secret the dev server needs into apps/web/.env, so the
      # job stores no repository secrets.
      - name: Generate environment
        run: pnpm run setup
        working-directory: apps/web

      - name: OIDC end-to-end tests
        run: pnpm exec playwright test --config playwright.config.mts --project=oidc
        working-directory: apps/web
        env:
          CI: "true"
          E2E_OIDC_ONLY: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Next dev log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-dev-log
          path: apps/web/.next/dev/logs/
          if-no-files-found: ignore
          retention-days: 14
