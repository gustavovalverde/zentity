name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  # ============================================
  # Detect which paths changed (gates downstream jobs)
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mcp: ${{ steps.filter.outputs.mcp }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      sdk: ${{ steps.filter.outputs.sdk }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/demo-rp/**'
              - 'packages/sdk/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            mcp:
              - 'apps/mcp/**'
              - 'packages/sdk/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            python:
              - 'apps/ocr/**'
            rust:
              - 'apps/fhe/**'
            sdk:
              - 'packages/sdk/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            ci:
              - '.github/workflows/test.yml'

  # ============================================
  # Web (apps/web unit + integration, apps/demo-rp)
  # ============================================
  web-test:
    name: Web Tests
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Install MCP deps (for mcp-http integration test subprocess)
        run: pnpm install --frozen-lockfile
        working-directory: apps/mcp
      - run: pnpm --filter @zentity/sdk build

      - name: Unit tests
        run: pnpm test:unit --coverage
        working-directory: apps/web

      - name: Integration tests
        run: pnpm test:integration
        working-directory: apps/web

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 14

      - name: Demo-RP tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @zentity/sdk build
          pnpm test
        working-directory: apps/demo-rp

  sdk-test:
    name: SDK Tests
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: packages/sdk
      - run: pnpm run build
        working-directory: packages/sdk
      - run: pnpm test
        working-directory: packages/sdk

  # ============================================
  # MCP Server (apps/mcp)
  # ============================================
  mcp-test:
    name: MCP Tests
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: apps/mcp
      - run: pnpm test
        working-directory: apps/mcp

  # ============================================
  # Python (apps/ocr)
  # ============================================
  python-test:
    name: Python Tests
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e '.[test]'
        working-directory: apps/ocr
      - name: Run tests with coverage
        run: pytest --cov=ocr_service --cov-report=term-missing
        working-directory: apps/ocr
        env:
          PYTHONPATH: src

  # ============================================
  # Rust (apps/fhe)
  # ============================================
  rust-test:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: FHE service tests
        run: cargo test --manifest-path apps/fhe/Cargo.toml

  # ============================================
  # Summary
  # ============================================
  summary:
    name: Test Summary
    if: always()
    needs: [changes, web-test, sdk-test, mcp-test, python-test, rust-test]
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        env:
          WEB_RESULT: ${{ needs.web-test.result }}
          SDK_RESULT: ${{ needs.sdk-test.result }}
          MCP_RESULT: ${{ needs.mcp-test.result }}
          PYTHON_RESULT: ${{ needs.python-test.result }}
          RUST_RESULT: ${{ needs.rust-test.result }}
        run: |
          format_status() {
            case "$1" in
              success)  echo "Passed" ;;
              failure)  echo "Failed" ;;
              skipped)  echo "Skipped (no changes)" ;;
              *)        echo "$1" ;;
            esac
          }

          {
            echo "## Test Results"
            echo ""
            echo "| Suite | Status |"
            echo "|-------|--------|"
            echo "| Web (unit + integration) | $(format_status "$WEB_RESULT") |"
            echo "| SDK | $(format_status "$SDK_RESULT") |"
            echo "| MCP Server | $(format_status "$MCP_RESULT") |"
            echo "| Python (OCR) | $(format_status "$PYTHON_RESULT") |"
            echo "| Rust (FHE) | $(format_status "$RUST_RESULT") |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WEB_RESULT" = "failure" ] || [ "$SDK_RESULT" = "failure" ] || \
             [ "$MCP_RESULT" = "failure" ] || \
             [ "$PYTHON_RESULT" = "failure" ] || [ "$RUST_RESULT" = "failure" ]; then
            {
              echo ""
              echo "One or more test suites failed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
