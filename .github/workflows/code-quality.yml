name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  # ============================================
  # Detect which paths changed (gates downstream jobs)
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      landing: ${{ steps.filter.outputs.landing }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      sdk: ${{ steps.filter.outputs.sdk }}
      markdown: ${{ steps.filter.outputs.markdown }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/demo-rp/**'
              - 'packages/sdk/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            landing:
              - 'apps/landing/**'
            python:
              - 'apps/ocr/**'
            rust:
              - 'apps/fhe/**'
            sdk:
              - 'packages/sdk/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            markdown:
              - '**/*.md'
              - '.markdownlint.json'
            ci:
              - '.github/workflows/code-quality.yml'
              - '.pre-commit-config.yaml'

  # ============================================
  # File hygiene (always runs, lightweight)
  # ============================================
  hygiene:
    name: File Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-hygiene-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-hygiene-${{ runner.os }}-
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: no-commit-to-branch,biome-check-web,tsc-check-web,knip-check-web,oxlint-type-aware-web,circuits-check-web,next-build-web,biome-check-landing,tsc-check-landing,vitest-unit-web,vitest-integration-web,markdownlint,ruff-check,ruff-format,cargo-fmt-fhe,cargo-clippy-fhe,commitlint,lockfile-sync-web,lockfile-sync-demo-rp,lockfile-sync-landing,lockfile-sync-mcp,lockfile-sync-fhe,mcp-test

  # ============================================
  # Commit & PR Quality
  # ============================================
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  # ============================================
  # TypeScript / JavaScript (apps/web)
  # ============================================
  web-lint:
    name: Web (Biome + tsc + Knip)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm --filter @zentity/sdk build
      - run: pnpm run lint:check
        working-directory: apps/web
      - run: pnpm run type-check
        working-directory: apps/web
      - run: pnpm run knip
        working-directory: apps/web

  sdk-lint:
    name: SDK (tsc + build)
    needs: changes
    if: needs.changes.outputs.sdk == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: packages/sdk
      - run: pnpm run typecheck
        working-directory: packages/sdk
      - run: pnpm run build
        working-directory: packages/sdk

  web-security:
    name: Web (Security Audit)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Run security audit
        run: pnpm audit --audit-level high
        working-directory: apps/web

  # ============================================
  # TypeScript / JavaScript (apps/landing)
  # ============================================
  landing-lint:
    name: Landing (Biome + tsc)
    needs: changes
    if: needs.changes.outputs.landing == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: apps/landing
      - run: pnpm run lint:check
        working-directory: apps/landing
      - run: pnpm run type-check
        working-directory: apps/landing

  # ============================================
  # Python (apps/ocr)
  # ============================================
  python-lint:
    name: Python (Ruff)
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check apps/ocr
      - run: ruff format --check apps/ocr

  python-security:
    name: Python (Security Audit)
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies and security tools
        run: |
          pip install pip-audit bandit
          pip install -e apps/ocr
      - name: Run pip-audit (dependency vulnerabilities)
        run: pip-audit
        continue-on-error: true
      - name: Run bandit (code security)
        run: bandit -r apps/ocr/src -ll -ii
        continue-on-error: true

  # ============================================
  # Rust (apps/fhe)
  # ============================================
  rust-lint:
    name: Rust (fmt + clippy)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path apps/fhe/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/fhe/Cargo.toml -- -D warnings

  rust-security:
    name: Rust (Security Audit)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/fhe/Cargo.toml
          command: check bans sources
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo-audit (FHE service)
        run: cargo audit --file apps/fhe/Cargo.lock
        continue-on-error: true

  # ============================================
  # Markdown (repo-wide)
  # ============================================
  markdown:
    name: Markdown (markdownlint)
    needs: changes
    if: needs.changes.outputs.markdown == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Run markdownlint (maintained docs)
        run: pnpm exec markdownlint "../../**/*.md" --config ../../.markdownlint.json --ignore "../../**/node_modules/**" --ignore "**/venv/**" --ignore "../../docs/archive/**" --ignore "../../docs/internal/**" --ignore "../../docs/ietf/**" --ignore "../../docs/papers/**" --ignore "../../docs/plans/**" --ignore "../../docs/research/**" --ignore "../../docs/rfcs/**" --ignore "../../presentations/**"
        working-directory: apps/web
