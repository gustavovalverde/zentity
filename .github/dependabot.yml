version: 2
updates:
  # JavaScript/TypeScript (pnpm workspace)
  # One pnpm workspace with a single root pnpm-lock.yaml. Running from the
  # root lets Dependabot resolve every workspace package (apps/web,
  # apps/landing, apps/mcp, apps/demo-rp, packages/sdk) through
  # pnpm-workspace.yaml and regenerate the root lockfile in the same PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: America/New_York
    open-pull-requests-limit: 5
    # Delay updates to mitigate supply-chain risks from newly released packages
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "javascript"
    # Vendored better-auth plugin tarballs (file:vendor/*.tgz in apps/web)
    # are rebuilt by hand, not published to the registry.
    ignore:
      - dependency-name: "@better-auth/ciba"
      - dependency-name: "@better-auth/haip"
      - dependency-name: "@better-auth/oidc4ida"
      - dependency-name: "@better-auth/oidc4vci"
      - dependency-name: "@better-auth/oidc4vp"
    # A dependency joins the first group that matches it, so better-auth
    # comes first and moves as one unit.
    groups:
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"
      prod-dependencies:
        dependency-type: production
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"

  # Python (pip)
  - package-ecosystem: pip
    directory: "/apps/ocr"
    schedule:
      interval: weekly
      day: monday
      timezone: America/New_York
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "python"

  # Rust (Cargo)
  - package-ecosystem: cargo
    directory: "/apps/fhe"
    schedule:
      interval: weekly
      day: monday
      timezone: America/New_York
    # Only update lockfile, not Cargo.toml versions
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "rust"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
