[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-service"
version = "0.1.0"
description = "Privacy-preserving OCR service for document processing"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.2",
    "iso3166==3.0.0",
    "mrz==0.6.2",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "opencv-python-headless==5.0.0.93",
    "opentelemetry-api==1.45.2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-sdk==1.45.2",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "python-stdnum==2.2",
    "rapidocr==3.10.0",
    "uvicorn==0.54.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]
dev = [
    "ruff==0.17.4",
    "pre-commit==4.7.0",
    # Security auditing
    "pip-audit==2.10.1",
    "bandit==1.9.4",
    # Include test deps in dev
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ocr_service"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100  # Allow longer lines for regex patterns
target-version = "py312"
exclude = ["venv", ".venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
]
ignore = [
    "S104",  # Possible binding to all interfaces (intentional for Docker)
    "S607",  # Partial executable path (git is in PATH)
    "S110",  # try-except-pass is intentional for graceful error handling
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Allow assert in non-test code if needed

[tool.ruff.format]
quote-style = "double"
