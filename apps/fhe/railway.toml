# yaml-language-server: $schema=https://railway.com/railway.schema.json
# FHE Service - Rust/Axum on port 5001
# Private networking only (no public domain)
#
# Required env vars (set via Railway dashboard/CLI):
#   RUST_LOG=info
#   PORT=5001
#   HOST=0.0.0.0  (IPv4 required for Railway healthchecks)
#   INTERNAL_SERVICE_TOKEN=<secret>
#   FHE_KEYS_DIR=/var/lib/zentity/fhe
#
# Required volumes (create via Railway dashboard):
#   fhe-volume → /var/lib/zentity/fhe
#     - Persists TFHE encryption keys (avoids regeneration on restart)

[build]
builder = "DOCKERFILE"

# drainingSeconds is the gap between SIGTERM and SIGKILL for the previous deploy (Railway's
# default is 0, which kills in-flight TFHE requests despite the graceful shutdown handler).
# Keep it above FHE_REQUEST_TIMEOUT_MS (default 60 s) so a request that started before the
# signal can finish.
[deploy]
drainingSeconds = 65
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
numReplicas = 1
