[package]
name = "fhe-service"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[lib]
name = "fhe_service"
path = "src/lib.rs"

[[bin]]
name = "fhe-service"
path = "src/main.rs"

[dependencies]
# FHE library
# Keys and ciphertexts cross the wire in tfhe's versioned `safe_serialization` format. Keep
# this in step with the browser client's tfhe/node-tfhe (apps/web/package.json).
tfhe = { version = "1.8", features = ["integer"] }

# Web framework
axum = "0.8"
tokio = { version = "1.54", features = ["full"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.7", features = ["trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
flate2 = "1.1"

# Utilities
uuid = { version = "1.29", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
once_cell = "1.21"
redb = "4.5"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
tracing-opentelemetry = "0.34"
opentelemetry-semantic-conventions = "0.33"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27"

[profile.release]
lto = "fat"
