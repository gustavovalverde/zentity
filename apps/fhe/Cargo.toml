[package]
name = "fhe-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
license-file = "../../LICENSE"

[lib]
name = "fhe_service"
path = "src/lib.rs"

[[bin]]
name = "fhe-service"
path = "src/main.rs"

[dependencies]
# FHE library
# Keys and ciphertexts cross the wire in tfhe's versioned `safe_serialization` format. Keep
# this in step with the browser client's tfhe/node-tfhe (apps/web/package.json).
tfhe = { version = "1.8", features = ["integer"] }

# Web framework
axum = "0.8"
tokio = { version = "1.54", features = ["full"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "decompression-gzip", "limit", "timeout", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"

# Utilities
uuid = { version = "1.29", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
jiff = { version = "1", default-features = false, features = ["std"] }
constant_time_eq = "0.6"
once_cell = "1.21"
redb = "4.5"
opentelemetry = "0.33"
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
tracing-opentelemetry = "0.34"
opentelemetry-semantic-conventions = "0.33"

[build-dependencies]
jiff = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
http-body-util = { version = "0.1", features = ["channel"] }
flate2 = "1.1"
tempfile = "3.27"

[lints.rust]
# Crypto service: no unsafe code and no look-alike identifiers.
unsafe_code = "deny"
non_ascii_idents = "deny"
rust_2021_compatibility = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }

[lints.clippy]
# Async code safety
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
# Integer safety
checked_conversions = "warn"
implicit_saturating_sub = "warn"
invalid_upcast_comparisons = "warn"
# Incomplete code markers and manual debug output
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Panic safety
fallible_impl_from = "warn"
unwrap_in_result = "warn"

[profile.release]
lto = "fat"

# TFHE key generation and homomorphic operations are orders of magnitude slower unoptimized,
# so the debug test profile optimizes the FHE crates. Release is unaffected.
[profile.dev.package.tfhe]
opt-level = 3
[profile.dev.package.tfhe-fft]
opt-level = 3
[profile.dev.package.tfhe-ntt]
opt-level = 3
[profile.dev.package.tfhe-csprng]
opt-level = 3
