packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': false
  '@reown/appkit': true
  '@synthetixio/synpress-cache': true
  '@tensorflow/tfjs-node': true
  bufferutil: false
  core-js: false
  esbuild: true
  keccak: false
  msgpackr-extract: false
  msw: true
  prisma: false
  protobufjs: true
  sharp: false
  unrs-resolver: false
  utf-8-validate: false

patchedDependencies:
  '@better-auth/oauth-provider@1.7.6': apps/web/vendor/@better-auth__oauth-provider@1.7.6.patch
  '@daveyplate/better-auth-ui': apps/web/vendor/@daveyplate__better-auth-ui.patch

overrides:
  'tar@<7.5.22': 7.5.22
  'axios@<1.20.0': 1.20.0
  'ws@>=8.0.0 <8.22.0': 8.22.0
  'fast-xml-parser@<5.8.0': 5.8.0
  'postcss@<8.5.28': 8.5.28
  '@tootallnate/once@<3.0.1': 3.0.1
  'bn.js@>=5.0.0 <5.2.3': 5.2.3
  'ajv@>=7.0.0-alpha.0 <8.18.0': 8.20.0
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'tsup@<=8.3.4': 8.5.1
  'esbuild@<=0.24.2': 0.28.0
  '@opentelemetry/propagator-jaeger@>=2.0.0 <2.9.0': 2.9.0
  '@openzeppelin/confidential-contracts@>=0.3.0 <0.3.2': 0.3.2
