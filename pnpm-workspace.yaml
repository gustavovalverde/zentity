packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': false
  '@reown/appkit': true
  '@synthetixio/synpress-cache': true
  '@tensorflow/tfjs-node': true
  bufferutil: false
  cbor-extract: false
  core-js: false
  esbuild: true
  keccak: false
  msgpackr-extract: false
  msw: true
  prisma: false
  protobufjs: true
  sharp: false
  unrs-resolver: false
  utf-8-validate: false

patchedDependencies:
  '@daveyplate/better-auth-ui': apps/web/vendor/@daveyplate__better-auth-ui.patch

auditConfig:
  ignoreGhsas:
    # @sd-jwt/* has no stable patched 0.19.x release; the vulnerable copy is pinned by @better-auth/oidc4vci and oidc4vp.
    - GHSA-f9j6-8p6x-r9j6
    # zod 3.x has no patched release (the fix is 4.6.6); the 3.x copies come from @reown/appkit dependencies.
    - GHSA-mrhx-c7xc-m3w5

overrides:
  'tar@<7.5.22': 7.5.22
  'adm-zip@<0.6.1': 0.6.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'node-forge@<1.4.1': 1.4.1
  'axios@<1.20.0': 1.20.0
  'ws@>=8.0.0 <8.22.0': 8.22.0
  'fast-xml-parser@<5.8.0': 5.8.0
  'postcss@<8.5.28': 8.5.28
  '@tootallnate/once@<3.0.1': 3.0.1
  'ajv@>=7.0.0-alpha.0 <8.18.0': 8.20.0
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'tsup@<=8.3.4': 8.5.1
  'esbuild@<=0.24.2': 0.28.0
  '@openzeppelin/confidential-contracts@>=0.3.0 <0.3.2': 0.3.2
  # 1.10.0 inlines its probe module as a charset-tagged data: URL that Turbopack cannot parse.
  'wasm-feature-detect@1.10.0': 1.9.0
