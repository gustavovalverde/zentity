packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': false
  '@reown/appkit': true
  '@synthetixio/synpress-cache': true
  '@tensorflow/tfjs-node': true
  bufferutil: false
  core-js: false
  esbuild: true
  keccak: false
  msgpackr-extract: false
  msw: true
  prisma: false
  protobufjs: true
  sharp: false
  unrs-resolver: false
  utf-8-validate: false

patchedDependencies:
  '@better-auth/oauth-provider@1.7.6': apps/web/vendor/@better-auth__oauth-provider@1.7.6.patch
  '@daveyplate/better-auth-ui': apps/web/vendor/@daveyplate__better-auth-ui.patch

