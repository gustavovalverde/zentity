packages:
  - apps/*
  - packages/*

allowBuilds:
  '@reown/appkit': true
  '@tensorflow/tfjs-node': true
  cbor-extract: false
  core-js: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  sharp: false

audit:
  ignore:
    # zod 3.x has no patched release (the fix is 4.6.6); the 3.x copies come from @reown/appkit-wallet and @coinbase/cdp-sdk (via @base-org/account).
    - GHSA-mrhx-c7xc-m3w5

# Releases younger than the one-day minimumReleaseAge when the lockfile was refreshed on 2026-11-17; drop these entries once pnpm install passes without them.
minimumReleaseAgeExclude:
  - '@hono/node-server@2.1.9'
  - '@owf/cose@0.8.0'
  - '@owf/identity-common@0.8.0'
  - '@owf/jose@0.8.0'
  - '@owf/token-status-list@0.8.0'
  - '@sd-jwt/core@0.25.0'
  - '@sd-jwt/sd-jwt-vc@0.25.0'
  - '@tanstack/query-core@5.107.2'
  - '@tanstack/react-query@5.107.2'
  - '@zkpassport/sdk@0.21.0'
  - fumadocs-core@16.19.4
  - fumadocs-ui@16.19.4
  - lucide-react@1.74.0
  - marked@18.2.1
  - minimatch@11.0.9
  - viem@2.58.0
  - '@zentity/contracts@0.9.0'

overrides:
  'tar@<7.5.22': 7.5.23
  'ws@>=8.0.0 <8.22.0': 8.23.0
  'glob@>=9.0.0 <14.0.2': 14.0.6
  'minimatch@>=7.0.0 <11.0.1': 11.0.9
  'katex@>=0.11.0 <0.19.1': 0.19.1
  'adm-zip@<0.6.1': 0.6.1
  'postcss@<8.5.28': 8.5.28
  'ajv@>=7.0.0-alpha.0 <8.18.0': 8.20.0
  # Two ranges so drizzle-kit keeps esbuild 0.25.x, which the 0.27.3-0.28.0 advisory does not cover.
  'esbuild@<=0.24.2': 0.28.2
  'esbuild@>=0.27.3 <0.28.1': 0.28.2
  '@openzeppelin/confidential-contracts@>=0.3.0 <0.3.2': 0.3.2
  'uuid@<11.1.1': 11.1.1
