packages:
  - apps/*
  - packages/*

allowBuilds:
  '@reown/appkit': true
  '@synthetixio/synpress-cache': true
  '@tensorflow/tfjs-node': true
  cbor-extract: false
  core-js: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  sharp: false

audit:
  ignore:
    # zod 3.x has no patched release (the fix is 4.6.6); the 3.x copies come from @reown/appkit-wallet and @coinbase/cdp-sdk (via @base-org/account).
    - GHSA-mrhx-c7xc-m3w5

overrides:
  'tar@<7.5.22': 7.5.23
  'axios@<1.20.0': 1.21.1
  'ws@>=8.0.0 <8.22.0': 8.23.0
  'glob@>=9.0.0 <14.0.2': 14.0.6
  'minimatch@>=7.0.0 <11.0.1': 11.0.9
  'katex@>=0.11.0 <0.19.1': 0.19.1
  'adm-zip@<0.6.1': 0.6.1
  'postcss@<8.5.28': 8.5.28
  'ajv@>=7.0.0-alpha.0 <8.18.0': 8.20.0
  'tsup@<=8.3.4': 8.5.1
  # Two ranges so drizzle-kit keeps esbuild 0.25.x, which the 0.27.3-0.28.0 advisory does not cover.
  'esbuild@<=0.24.2': 0.28.2
  'esbuild@>=0.27.3 <0.28.1': 0.28.2
  '@openzeppelin/confidential-contracts@>=0.3.0 <0.3.2': 0.3.2
  'uuid@<11.1.1': 11.1.1
